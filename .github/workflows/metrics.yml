name: Metrics

on:
  # Atualiza todo dia às 09:00 UTC (06:00 em Brasília)
  schedule:
    - cron: "0 9 * * *"
  # Permite rodar manualmente pela aba Actions
  workflow_dispatch:
  # Regera ao dar push na branch principal
  push:
    branches: ["main"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # ─────────────────────────────────────────────────────────────
      # Card principal: cabeçalho, repositórios, calendário e linguagens
      # ─────────────────────────────────────────────────────────────
      - name: Card principal
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: metrics.svg
          user: marcusslv
          template: classic
          base: header, repositories
          config_timezone: America/Sao_Paulo

          # Calendário de contribuições em isométrico
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Distribuição de linguagens
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_languages_limit: 8
          plugin_languages_sections: most-used
          plugin_languages_ignored: >-
            html, css, scss, blade, hack, dockerfile, makefile, shell
